name: Build (Production)

# Builds the production variant (`gpRelease`) on dispatch. Outputs go only to a private Cloud
# Storage bucket, since Actions artifacts are public in this repository. Signing runs in its own
# job behind the `production-distribution` approval; `distribute` sends the signed APK to the
# internal tester group behind a second approval.

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'none = unsigned artifact (default). production = sign with the release keystore (requires approval).'
        type: choice
        default: none
        options: [none, production]
      ref:
        description: 'Empty = the dispatched commit. Otherwise a production/* tag, to rebuild a frozen baseline.'
        type: string
        default: ''
      version_code:
        description: 'versionCode. For a Play upload use the latest in Play Console + 1. Defaults to the run number.'
        type: string
        default: ''
      distribute:
        description: 'Send the signed APK to the production Firebase tester group. Requires signing=production.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-production-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  # Composite uploads delete their temporary parts, and the build identity cannot delete.
  CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"
  NDK_VERSION: "29.0.14206865"
  PRODUCTION_APPLICATION_ID: io.pcf.polkadotapp

jobs:
  # Production builds come only from the production branch or a production/* tag.
  resolve:
    name: Require a production ref
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.trusted.outputs.sha }}
    steps:
      - name: Resolve the commit to build
        id: trusted
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/production | refs/tags/production/*) ;;
            *)
              echo "::error::production builds run only when dispatched on the production branch or a production/* tag"
              exit 1
              ;;
          esac
          if [ -z "$INPUT_REF" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "building the dispatched commit $GITHUB_SHA ($GITHUB_REF)"
            exit 0
          fi
          if [[ ! "$INPUT_REF" =~ ^production/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::ref must be empty or a production/* tag; branches and SHAs are refused"
            exit 1
          fi
          # Annotated tags resolve through their peeled ^{} line.
          refs=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "refs/tags/$INPUT_REF" "refs/tags/$INPUT_REF^{}")
          sha=$(awk -v t="refs/tags/$INPUT_REF" '$2 == t "^{}" {p = $1} $2 == t {d = $1} END {print (p != "" ? p : d)}' <<< "$refs")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag $INPUT_REF does not exist"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building tag $INPUT_REF at $sha"

  build:
    name: Build gpRelease (unsigned)
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      apk: ${{ steps.upload.outputs.apk }}
      aab: ${{ steps.upload.outputs.aab }}
    steps:
      - name: Require the private output configuration
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in BUILD_BUCKET GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment; refusing to build without a private output"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to `tools platform-tools`; Google removed `tools`, so the default fails on an SDK cache miss.
          packages: platform-tools

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}" "platforms;android-36"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json (release source set)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_PROD_BASE64 is not set in the 'production' environment."
            exit 1
          fi
          mkdir -p app/src/release
          echo "$GS_B64" | base64 --decode > app/src/release/google-services.json

      # A mismatched google-services.json builds fine and then misroutes Crashlytics and Analytics.
      - name: Verify google-services.json targets the production package
        run: |
          FILE=app/src/release/google-services.json
          if ! jq -e . "$FILE" >/dev/null 2>&1; then
            echo "::error::GOOGLE_SERVICES_JSON_PROD_BASE64 did not decode to valid JSON."
            exit 1
          fi
          # any(): the file lists one client per package, and `jq -e` would otherwise judge only the last.
          if ! jq -e --arg pkg "$PRODUCTION_APPLICATION_ID" \
               'any(.client[]?; .client_info.android_client_info.package_name == $pkg)' "$FILE" >/dev/null; then
            echo "::error::The decoded google-services.json has no client entry for $PRODUCTION_APPLICATION_ID. \
          Found: $(jq -r '[.client[]?.client_info.android_client_info.package_name] | join(", ")' "$FILE"). \
          The production build must use the production Firebase app, not the dev one."
            exit 1
          fi
          echo "google-services.json carries a client entry for $PRODUCTION_APPLICATION_ID"

      - name: Assemble + bundle gpRelease
        env:
          # Play needs a versionCode above every one already uploaded, and the run number is not.
          CI_BUILD_ID: ${{ inputs.version_code || github.run_number }}
          PRODUCTION_APPLICATION_ID: ${{ vars.PRODUCTION_APPLICATION_ID }}
          APPLICATION_ID: ${{ vars.APPLICATION_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL }}
          FIAT_SYMBOL: ${{ vars.FIAT_SYMBOL }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID_PROD || secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID_PROD || secrets.GOOGLE_PROJECT_ID }}
          # Required at configuration time; the faucet is disabled in release builds.
          NIGHTLY_FUNDING_MNEMONIC: 'unused in production faucet disabled in release builds'
        run: |
          # Versions.kt falls back to a fixed versionCode when CI_BUILD_ID is not an integer.
          if ! [[ "$CI_BUILD_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer, got '$CI_BUILD_ID'."
            exit 1
          fi
          for V in PRODUCTION_APPLICATION_ID APPLICATION_ID IOS_BUNDLE_ID APPLICATION_NAME CONTACT_EMAIL CURRENCY_SYMBOL FIAT_SYMBOL FIRESTORE_DATABASE_ID LOG_COLLECTION_EMAIL PRIVACY_POLICY_URL TERMS_OF_USE_URL SENTRY_ORG SENTRY_PROJECT GOOGLE_OAUTH_ID GOOGLE_PROJECT_ID; do
            if [ -z "${!V}" ]; then
              echo "::error::Missing '$V' in the 'production' environment."
              exit 1
            fi
          done
          ./gradlew :app:assembleGpRelease :app:bundleGpRelease \
            --no-daemon --stacktrace

      - name: Report signing state (expect UNSIGNED)
        run: |
          APK=$(find app/build/outputs/apk/gp/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no gpRelease APK produced"; exit 1; }
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          echo "### Production build — signing state" >> "$GITHUB_STEP_SUMMARY"
          if "$BT/apksigner" verify --print-certs "$APK" > certs.txt 2>&1; then
            echo "::warning::The gpRelease APK is SIGNED but this job holds no production key material."
            grep -i 'SHA-256 digest' certs.txt || true
            { echo '- ⚠️ unexpectedly SIGNED — inspect the run'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gpRelease APK is UNSIGNED, as expected for the build job."
            { echo '- ✅ UNSIGNED (as designed; the build job holds no keystore)'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Upload the unsigned build to the private bucket
        id: upload
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/gp/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/gpRelease -name '*.aab' | head -1)
          [ -n "$APK" ] || { echo "::error::no gpRelease APK produced"; exit 1; }
          [ -n "$AAB" ] || { echo "::error::no gpRelease AAB produced"; exit 1; }
          PREFIX="android/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/unsigned"
          for f in "$APK" "$AAB"; do
            gcloud storage cp --if-generation-match=0 "$f" "gs://${BUILD_BUCKET}/${PREFIX}/$(basename "$f")"
          done
          echo "apk=${PREFIX}/$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "aab=${PREFIX}/$(basename "$AAB")" >> "$GITHUB_OUTPUT"
          {
            echo "### Unsigned build stored privately"
            echo '```'
            echo "gs://${BUILD_BUCKET}/${PREFIX}/$(basename "$APK")"
            echo "gs://${BUILD_BUCKET}/${PREFIX}/$(basename "$AAB")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: State plainly that nothing was published
        run: |
          {
            echo "### Nothing was published"
            echo "The build exists only in a private bucket readable by PCF operators. No GitHub Actions"
            echo "artifact, no Play upload, no Firebase App Distribution, no R2 copy, no GitHub Release."
            echo ""
            echo "- application id: \`$PRODUCTION_APPLICATION_ID\` (devnet lane builds \`io.pcf.polkadotapp.dev\`)"
            echo "- signing input: \`${{ github.event.inputs.signing || 'none' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Fails before the signing approval is requested when no production keystore is configured.
  preflight:
    name: Pre-flight (production signing material)
    if: ${{ github.event.inputs.signing == 'production' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Refuse to request an approval that can only fail
        env:
          SIGNING_AVAILABLE: ${{ vars.PRODUCTION_SIGNING_AVAILABLE }}
        run: |
          if [ "$SIGNING_AVAILABLE" != "true" ]; then
            echo "::error::signing=production was requested, but the 'production' environment does \
          not declare PRODUCTION_SIGNING_AVAILABLE=true. Re-run with signing=none for an unsigned artifact."
            exit 1
          fi
          echo "production signing material is declared available; the approval gate is next."

  # Pauses for the `production-distribution` approval before any key material is read.
  sign:
    name: Sign with the production keystore
    needs: [build, preflight]
    if: ${{ github.event.inputs.signing == 'production' }}
    runs-on: ubuntu-latest
    environment: production-distribution
    permissions:
      contents: read
      id-token: write
    outputs:
      apk: ${{ steps.upload_signed.outputs.apk }}
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to `tools platform-tools`; Google removed `tools`, so the default fails on an SDK cache miss.
          packages: platform-tools

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Download the unsigned build from the private bucket
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
          APK_OBJECT: ${{ needs.build.outputs.apk }}
          AAB_OBJECT: ${{ needs.build.outputs.aab }}
        run: |
          set -euo pipefail
          [ -n "$BUILD_BUCKET" ] || { echo "::error::BUILD_BUCKET is not set in the production-distribution environment"; exit 1; }
          mkdir -p unsigned
          gcloud storage cp "gs://${BUILD_BUCKET}/${APK_OBJECT}" unsigned/
          gcloud storage cp "gs://${BUILD_BUCKET}/${AAB_OBJECT}" unsigned/

      - name: Require the production key material
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEYSTORE_KEY_PASS }}
        run: |
          MISSING=""
          [ -n "$KEYSTORE_B64" ] || MISSING="$MISSING RELEASE_KEYSTORE_BASE64"
          [ -n "$STORE_PASS" ]   || MISSING="$MISSING RELEASE_KEYSTORE_PASS"
          [ -n "$KEY_ALIAS" ]    || MISSING="$MISSING RELEASE_KEYSTORE_KEY_ALIAS"
          [ -n "$KEY_PASS" ]     || MISSING="$MISSING RELEASE_KEYSTORE_KEY_PASS"
          if [ -n "$MISSING" ]; then
            echo "::error::signing=production was requested but the 'production-distribution' \
          environment is missing:$MISSING. Re-run with signing=none to produce an unsigned artifact."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Sign the APK and the AAB
        env:
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEYSTORE_KEY_PASS }}
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          APK=$(find unsigned -name '*.apk' | head -1)
          AAB=$(find unsigned -name '*.aab' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK in the unsigned artifact"; exit 1; }

          "$BT/zipalign" -p -f 4 "$APK" "${APK%.apk}-aligned.apk"
          mv "${APK%.apk}-aligned.apk" "$APK"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:STORE_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            "$APK"

          if [ -n "$AAB" ]; then
            jarsigner -verbose:false \
              -keystore "$RUNNER_TEMP/release.jks" \
              -storepass:env STORE_PASS \
              -keypass:env KEY_PASS \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              "$AAB" "$KEY_ALIAS"
          fi

      # The certificate fingerprint is public: every copy of the APK carries it.
      - name: Print the signing certificate and reject the dev key
        env:
          DEV_KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          APK=$(find unsigned -name '*.apk' | head -1)

          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          PROD_SHA=$(grep -im1 'certificate SHA-256 digest' certs.txt | awk -F': ' '{print $2}' | tr -d ' ')
          if [ -z "$PROD_SHA" ]; then
            echo "::error::signing=production was requested but the APK carries no certificate."
            exit 1
          fi
          {
            echo "### Production signing certificate"
            echo '```'
            echo "SHA-256: $PROD_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail loudly if this is actually the DEV keystore wearing a production label.
          if [ -n "$DEV_KEYSTORE_B64" ]; then
            echo "$DEV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dev.jks"
            DEV_SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/dev.jks" \
                        -storepass "$DEV_STORE_PASS" 2>/dev/null \
                      | grep -im1 'SHA256:' | awk -F'SHA256: ' '{print $2}' | tr -d ' :' | tr 'A-F' 'a-f')
            NORM_PROD=$(echo "$PROD_SHA" | tr -d ':' | tr 'A-F' 'a-f')
            if [ -n "$DEV_SHA" ] && [ "$DEV_SHA" = "$NORM_PROD" ]; then
              echo "::error::signing=production produced an artifact signed with the DEV keystore. \
          Refusing to pass this off as a production build."
              exit 1
            fi
            echo "Confirmed: the signing certificate is NOT the dev keystore."
          else
            echo "::warning::DEV_KEYSTORE_BASE64 is not readable here, so the dev-key comparison was skipped. \
          Verify the fingerprint above by hand."
          fi

      - name: Upload the signed build to the private bucket
        id: upload_signed
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
        run: |
          set -euo pipefail
          PREFIX="android/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/signed"
          {
            echo "### Signed build stored privately"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in unsigned/*.apk unsigned/*.aab; do
            gcloud storage cp --if-generation-match=0 "$f" "gs://${BUILD_BUCKET}/${PREFIX}/$(basename "$f")"
            echo "gs://${BUILD_BUCKET}/${PREFIX}/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "apk=${PREFIX}/$(basename "$(find unsigned -name '*.apk' | head -1)")" >> "$GITHUB_OUTPUT"

      - name: State plainly what happens to this build
        run: |
          {
            if [ "${{ inputs.distribute }}" = "true" ]; then
              echo "### Handed to the distribute job"
              echo "The signed build is in a private bucket readable by PCF operators, and \`distribute\`"
              echo "will send it to the production Firebase tester group once that job's approval clears."
              echo "No Play upload, no R2 copy, no GitHub Release, no GitHub Actions artifact."
            else
              echo "### Nothing was published"
              echo "The signed build exists only in a private bucket readable by PCF operators. No GitHub"
              echo "Actions artifact, no Play upload, no Firebase App Distribution, no R2 copy, no GitHub Release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A signed build tags the commit it built. Rebuilds of a production/* tag are already tagged.
  tag:
    name: Tag the signed commit
    needs: [resolve, sign]
    if: ${{ github.event.inputs.signing == 'production' && inputs.ref == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Tag the built commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/production/${DATE}.*" \
            | sed -n "s#.*refs/tags/production/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          TAG="production/${DATE}.$(( ${LAST:-0} + 1 ))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Android production build ${GITHUB_RUN_NUMBER} (run ${GITHUB_RUN_ID}), signed"
          git push origin "refs/tags/$TAG"
          echo "### Tagged \`$TAG\` at ${SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

  # Sends the signed APK to the internal tester group, behind a second approval.
  distribute:
    name: Distribute to the internal production tester group
    needs: sign
    if: ${{ inputs.distribute && github.event.inputs.signing == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: production-internal-tester-distribution
      url: https://console.firebase.google.com/project/polkadot-community-foundation/appdistribution
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the production distribution configuration
        env:
          FIREBASE_APP_ID_ANDROID_PROD: ${{ vars.FIREBASE_APP_ID_ANDROID_PROD }}
          FIREBASE_TESTER_GROUPS_PROD: ${{ vars.FIREBASE_TESTER_GROUPS_PROD }}
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
          APK_OBJECT: ${{ needs.sign.outputs.apk }}
        run: |
          set -euo pipefail
          fail=0
          for name in FIREBASE_APP_ID_ANDROID_PROD FIREBASE_TESTER_GROUPS_PROD BUILD_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the 'production-internal-tester-distribution' environment."
              fail=1
            fi
          done
          if [ -z "$APK_OBJECT" ]; then
            echo "::error::the sign job did not report a signed APK object."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Distributing to group(s): $FIREBASE_TESTER_GROUPS_PROD"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Fetch the signed APK from the private bucket
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
          APK_OBJECT: ${{ needs.sign.outputs.apk }}
        run: |
          set -euo pipefail
          mkdir -p signed
          gcloud storage cp "gs://${BUILD_BUCKET}/${APK_OBJECT}" signed/

      - name: Compose App Distribution release notes
        id: notes
        env:
          BUILT_REF: ${{ github.event.inputs.ref || github.ref_name }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          set -euo pipefail
          APK=$(find signed -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK downloaded from the private bucket"; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          NOTES="$RUNNER_TEMP/release-notes.txt"
          {
            echo "Polkadot app PRODUCTION build (Android), versionCode ${VERSION_CODE}."
            echo
            echo "Built from ${BUILT_REF}. Signed with the production release key."
          } > "$NOTES"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Distribute the signed APK to the internal production tester group
        run: |
          scripts/ci/firebase-app-distribution.sh \
            "${{ steps.notes.outputs.apk }}" \
            "${{ vars.FIREBASE_APP_ID_ANDROID_PROD }}" \
            "${{ vars.FIREBASE_TESTER_GROUPS_PROD }}" \
            "${{ steps.notes.outputs.notes }}"
