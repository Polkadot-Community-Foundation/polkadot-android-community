name: Detekt Code Quality

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# PCF fork: the required build variables fall back to the values the fork ships when no
# repository Variable is set (upstream reads them with readSecretOrThrow, empty == missing).
env:
  APPLICATION_ID: ${{ vars.APPLICATION_ID || 'io.paritytech.polkadotapp' }}
  APPLICATION_NAME: ${{ vars.APPLICATION_NAME || 'Polkadot' }}
  CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL || 'CASH' }}
  GAME_RESULTS_FALLBACK_URL: ${{ vars.GAME_RESULTS_FALLBACK_URL }}
  LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL || 'logs@example.com' }}
  PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || 'https://example.com/privacy' }}
  REFERRAL_WEB_HOST: ${{ vars.REFERRAL_WEB_HOST }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG || 'your-sentry-org' }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'your-sentry-project' }}
  TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL || 'https://example.com/terms' }}

on:
  pull_request:
  merge_group:

jobs:
  detekt:
    name: Run Detekt Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install dependencies
        uses: ./.github/actions/install/

      - name: Run Detekt
        env:
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID || vars.FIRESTORE_DATABASE_ID || '(default)' }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC || secrets.DEV_FUNDING_MNEMONIC }}
          W3S_AUTH_KEY: ${{ secrets.W3S_AUTH_KEY }}
        run: ./gradlew detekt --no-daemon --stacktrace
