name: Pull request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  APPLICATION_ID: ${{ vars.APPLICATION_ID || 'io.pcf.polkadotapp' }}
  IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'io.pcf.polkadotapp' }}
  APPLICATION_NAME: ${{ vars.APPLICATION_NAME || 'Polkadot' }}
  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'info@pcf.network' }}
  CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL || 'CASH' }}
  FIAT_SYMBOL: ${{ vars.FIAT_SYMBOL || '$' }}
  GAME_RESULTS_FALLBACK_URL: ${{ vars.GAME_RESULTS_FALLBACK_URL }}
  LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL || 'logs@example.com' }}
  PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || 'https://example.com/privacy' }}
  REFERRAL_WEB_HOST: ${{ vars.REFERRAL_WEB_HOST }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG || 'your-sentry-org' }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'your-sentry-project' }}
  TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL || 'https://example.com/terms' }}

on:
  pull_request:
  merge_group:

jobs:
  lint-and-test:
    name: Run linter and tests
    if: github.event_name == 'merge_group' || ! startsWith(github.event.pull_request.head.ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🔧 Install dependencies
        uses: ./.github/actions/install/

      - name: Prepare Android build files
        uses: ./.github/actions/prepare-android-build
        with:
          google_services_json_base64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}

      - name: Run tests
        env:
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || '(default)' }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.DEV_FUNDING_MNEMONIC }}
          W3S_AUTH_KEY: ${{ secrets.W3S_AUTH_KEY }}
        run: ./gradlew testGpDebugUnitTest testGpReleaseUnitTest testDebugUnitTest testReleaseUnitTest --no-daemon --stacktrace

  build:
    name: Run build
    if: github.event_name == 'merge_group' || ! startsWith(github.event.pull_request.head.ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🔧 Install dependencies
        uses: ./.github/actions/install/

      - name: Prepare Android build files
        uses: ./.github/actions/prepare-android-build
        with:
          google_services_json_base64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
          keystore_file_base64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          keystore_path: develop_key.jks

      - name: Build
        env:
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || '(default)' }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.DEV_FUNDING_MNEMONIC }}
          W3S_AUTH_KEY: ${{ secrets.W3S_AUTH_KEY }}
        run: ./gradlew assembleGpDebug --no-daemon --stacktrace
