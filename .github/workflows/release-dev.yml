name: Release (Dev)

# Devnet Android release. A dispatch on `devnet` builds the `dev` variant (io.pcf.polkadotapp.dev),
# tags the commit `devnet/<YYYY-MM-DD>.<n>`, then publishes it and sends it to testers, each behind
# `tester-distribution`. A dispatch on any other branch only uploads the APKs as run artifacts.
# Upstream's nightly_release, genesis_hash_monitor, firebase_debug_distribution and
# firebase_release_distribution workflows are deleted on purpose (they publish or open PRs
# unattended); do not restore them.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavors to build (gp = Google services, vanilla = no GMS)'
        type: choice
        default: gp vanilla
        options: [gp vanilla, gp, vanilla]
      distribute:
        # Opt-out only: it can skip distribution on a devnet run, never enable it elsewhere.
        description: 'Allow App Distribution (only takes effect on a devnet-branch run)'
        type: boolean
        default: true

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"
  # space-separated list; the workflow_dispatch input can narrow it to one flavor
  FLAVORS: ${{ github.event.inputs.flavor || 'gp vanilla' }}
  HAS_R2: ${{ secrets.R2_UPLOAD_TOKEN != '' }}
  # Keyless (Workload Identity Federation) — no service-account JSON key in the repo.
  HAS_FIREBASE: ${{ secrets.GCP_WIP_GITHUB != '' && secrets.GCP_SA_GITHUB != '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: devnet
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to `tools platform-tools`; Google removed `tools`, so the default fails on an SDK cache miss.
          packages: platform-tools

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}" "platforms;android-36"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > dev_key.jks

      - name: Decode google-services.json (dev source set)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
        run: |
          mkdir -p app/src/dev
          echo "$GS_B64" | base64 --decode > app/src/dev/google-services.json

      - name: Assemble dev APKs (${{ env.FLAVORS }}, Paseo)
        env:
          CI_BUILD_ID: ${{ github.run_number }}
          # The dev signingConfig signs at build time with the decoded keystore.
          DEV_KEYSTORE_FILE: ${{ github.workspace }}/dev_key.jks
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
          # The release signingConfig is only read at configuration time.
          RELEASE_KEYSTORE_PASS: placeholder
          RELEASE_KEYSTORE_KEY_ALIAS: placeholder
          RELEASE_KEYSTORE_KEY_PASS: placeholder
          # throwing app secrets (readSecret)
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          # faucet (throwing secret: an empty value fails the build)
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.DEV_FUNDING_MNEMONIC }}
          # Required build variables
          APPLICATION_ID: ${{ vars.APPLICATION_ID || 'io.pcf.polkadotapp' }}
          APPLICATION_NAME: ${{ vars.APPLICATION_NAME || 'Polkadot' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'info@pcf.network' }}
          CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL || 'CASH' }}
          FIAT_SYMBOL: ${{ vars.FIAT_SYMBOL || '$' }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID || '(default)' }}
          LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL || 'logs@example.com' }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || 'https://example.com/privacy' }}
          TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL || 'https://example.com/terms' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'your-sentry-org' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'your-sentry-project' }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          TASKS=""
          for F in $FLAVORS; do TASKS="$TASKS assemble${F^}Dev"; done
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: Locate + rename APKs (product-facing names)
        id: apk
        run: |
          find app/build/outputs/apk -path '*/dev/*.apk' -print
          GP=""
          GP_SRC=$(find app/build/outputs/apk/gp/dev -name '*.apk' 2>/dev/null | head -1)
          if [ -n "$GP_SRC" ]; then
            GP="$(dirname "$GP_SRC")/app-polkadot-devnet.apk"
            mv "$GP_SRC" "$GP"
          fi
          VAN_SRC=$(find app/build/outputs/apk/vanilla/dev -name '*.apk' 2>/dev/null | head -1)
          if [ -n "$VAN_SRC" ]; then
            mv "$VAN_SRC" "$(dirname "$VAN_SRC")/app-polkadot-devnet-nogms.apk"
          fi
          echo "gp=$GP" >> "$GITHUB_OUTPUT"

      - name: Upload gp APK artifact
        if: contains(env.FLAVORS, 'gp')
        uses: actions/upload-artifact@v4
        with:
          name: app-polkadot-devnet
          path: app/build/outputs/apk/gp/dev/*.apk

      - name: Upload vanilla APK artifact
        if: contains(env.FLAVORS, 'vanilla')
        uses: actions/upload-artifact@v4
        with:
          name: app-polkadot-devnet-nogms
          path: app/build/outputs/apk/vanilla/dev/*.apk

  # ---- Tag — devnet branch only -----------------------------------------------------------
  # The build creates the tag: every devnet release tags the commit it built, before the
  # approval gates below, so a rejected publish still records what was built.
  tag:
    needs: release
    if: github.ref == 'refs/heads/devnet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag the built commit
        id: tag
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/devnet/${DATE}.*" \
            | sed -n "s#.*refs/tags/devnet/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          TAG="devnet/${DATE}.$(( ${LAST:-0} + 1 ))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Android devnet build ${GITHUB_RUN_NUMBER} (run ${GITHUB_RUN_ID})"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Tagged \`$TAG\` at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

  # ---- Publishing — MANUAL APPROVAL GATE ------------------------------------------------
  # The GitHub Release and the downloads-host copy wait for the `tester-distribution` approval.
  publish:
    needs: [release, tag]
    if: github.ref == 'refs/heads/devnet'
    runs-on: ubuntu-latest
    environment:
      name: tester-distribution
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    permissions:
      contents: write
    env:
      FLAVORS: ${{ github.event.inputs.flavor || 'gp vanilla' }}
      HAS_R2: ${{ secrets.R2_UPLOAD_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # Only the release body template is needed; skip the full history.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/SUPPORTED_DEVICES.md
          sparse-checkout-cone-mode: false

      - name: Download the APKs built by the release job
        uses: actions/download-artifact@v4
        with:
          pattern: app-polkadot-devnet*
          path: apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: apk/*/*.apk
          generate_release_notes: true
          body_path: docs/SUPPORTED_DEVICES.md
          append_body: true
          prerelease: true

      - name: Publish APK to downloads host
        if: ${{ env.HAS_R2 == 'true' && contains(env.FLAVORS, 'gp') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_UPLOAD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: pcf-downloads
          APK: apk/app-polkadot-devnet/app-polkadot-devnet.apk
        run: |
          VERSION="${TAG#devnet/}"
          NAME="polkadot-android-dev-${VERSION}.apk"
          CT="application/vnd.android.package-archive"
          sha256sum "$APK" | awk '{print $1}' > "$NAME.sha256"
          npx --yes wrangler@3 r2 object put "$BUCKET/android/dev/$NAME"        --file="$APK" --content-type="$CT"
          npx --yes wrangler@3 r2 object put "$BUCKET/android/dev/$NAME.sha256" --file="$NAME.sha256" --content-type="text/plain"
          npx --yes wrangler@3 r2 object put "$BUCKET/android/dev/latest.apk"   --file="$APK" --content-type="$CT"
          {
            echo "### Published Paseo dev build to downloads host"
            echo "- https://get.polkadotcommunity.foundation/android/dev/$NAME"
            echo "- https://get.polkadotcommunity.foundation/android/dev/latest.apk"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Firebase App Distribution — MANUAL APPROVAL GATE ------------------------------
  # gp only: both flavors share one application id, so one Firebase app. Devices without Google
  # Play services take the -nogms APK from the GitHub Release.
  distribute:
    needs: [tag, publish]
    if: ${{ github.ref == 'refs/heads/devnet' && vars.FIREBASE_APP_ID_ANDROID_DEV != '' && inputs.distribute }}
    runs-on: ubuntu-latest
    environment:
      name: tester-distribution
      url: ${{ vars.FIREBASE_INVITE_LINK || 'https://appdistribution.firebase.dev/i/f3b79521380b40b9' }}
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation → Firebase App Distribution
    steps:
      # Only the distribution script is needed; skip the full history.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false

      - name: Download the gp APK built by the release job
        uses: actions/download-artifact@v4
        with:
          name: app-polkadot-devnet
          path: apk

      - name: Compose App Distribution release notes
        id: notes
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK in the release artifact"; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          NOTES="$RUNNER_TEMP/release-notes.txt"
          {
            echo "Polkadot app devnet build \`$TAG\` (Android)."
            echo
            echo "Commit ${GITHUB_SHA:0:8} · build ${GITHUB_RUN_NUMBER}"
            echo
            echo "This build points at the public products devnet. It is a development"
            echo "build for testing only — state may be wiped."
            echo
            echo "Running a device without Google Play services? App Distribution only"
            echo "carries the Google-services build — take the -nogms APK from the"
            echo "GitHub Release instead:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "Something broken? Report it:"
            echo "https://github.com/Polkadot-Community-Foundation/products-devnet-issues/issues/new/choose"
          } > "$NOTES"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ secrets.GCP_SA_GITHUB }}
          workload_identity_provider: ${{ secrets.GCP_WIP_GITHUB }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Distribute gp APK to Firebase App Distribution
        run: |
          scripts/ci/firebase-app-distribution.sh \
            "${{ steps.notes.outputs.apk }}" \
            "${{ vars.FIREBASE_APP_ID_ANDROID_DEV }}" \
            "${{ vars.FIREBASE_TESTER_GROUPS }}" \
            "${{ steps.notes.outputs.notes }}"
